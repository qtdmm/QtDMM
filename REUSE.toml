# Copyright and licence of the files that cannot carry a header (data,
# images, documentation, generated files) and of the bundled third-party
# code. Checked by `reuse lint` (https://reuse.software, CI job "reuse").
# Source files carry their own SPDX header; a header wins over this file.
# Of several annotations matching a file, the last one applies.
version = 1

# QtDMM's own data, documentation and build files
[[annotations]]
path = [
  "**/*.md", "**/*.json", "**/*.yaml", "**/*.csv", "**/*.txt", "**/*.log", "**/*.xml", "**/*.bin",
  "**/*.svg", "**/*.png", "**/*.ico", "**/*.icns", "**/*.ui", "**/*.ts", "**/*.rc", "**/*.in",
  "**/*.patch", "**/*.service", "**/*.toml",
  "assets/linux/70-qtdmm.rules",   # generated by udevRules(), checked by ctest device_discovery
  ".archive-version", ".gitattributes", ".gitignore", ".mailmap", ".sonarcloud.properties", ".copr/Makefile",
  "AUTHORS", "INSTALL", "Doxyfile", "PKGBUILD", "qtdmm.spec", "flake.lock", "assets/astylerc",
]
SPDX-FileCopyrightText = "The QtDMM developers"
SPDX-License-Identifier = "GPL-3.0-or-later"

# AppStream metadata (its <metadata_license>)
[[annotations]]
path = "assets/appimage/qtdmm.appdata.xml"
SPDX-FileCopyrightText = "The QtDMM developers"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Textures of the designs: AI-generated for QtDMM (assets/textures/README.md)
[[annotations]]
path = "assets/textures/*.jpg"
SPDX-FileCopyrightText = "The QtDMM developers (AI-generated)"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Alarm sounds from freesound.org, CC0 (assets/sounds/README.md)
[[annotations]]
path = "assets/sounds/*.wav"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Icon themes copied from KDE (tools/update_icons.py)
[[annotations]]
path = "assets/icons/sets/qtdmm-breeze*/**"
SPDX-FileCopyrightText = "KDE Visual Design Group"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = "assets/icons/sets/qtdmm-oxygen/**"
SPDX-FileCopyrightText = "2007 David Miller, David Vignoni, Johann Ollivier Lapeyre, Kenneth Wimer, Nuno Pinheiro, Riccardo Iaconelli and the KDE community"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["assets/icons/sets/LICENSE.breeze", "assets/icons/sets/LICENSE.oxygen"]
SPDX-FileCopyrightText = "Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-3.0-or-later"

# QtDMM's own symbols, also where update_icons.py copied them into the sets
[[annotations]]
path = ["assets/icons/own/**", "assets/icons/sets/**/qtdmm-*", "assets/icons/sets/*/index.theme"]
SPDX-FileCopyrightText = "The QtDMM developers"
SPDX-License-Identifier = "GPL-3.0-or-later"

# the sigrok logo without its lettering (libsigrokdecode contrib/sigrok-logo-notext.png)
[[annotations]]
path = ["assets/icons/own/*/qtdmm-sigrok.svg", "assets/icons/sets/**/qtdmm-sigrok.svg"]
SPDX-FileCopyrightText = "The sigrok project"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Manufacturers' datasheets and protocol documents, kept as the sources of the
# decoders; no licence granted
[[annotations]]
path = ["docs/protocols/sources/*.pdf", "docs/protocols/sources/*.PDF"]
SPDX-FileCopyrightText = "The respective manufacturers"
SPDX-License-Identifier = "LicenseRef-Datasheet"

# Bundled third-party code (src/3rdparty, not edited except qcustomplot,
# which carries its own SPDX header)
[[annotations]]
path = "src/3rdparty/miniz/**"
SPDX-FileCopyrightText = ["2013-2014 RAD Game Tools and Valve Software", "2010-2014 Rich Geldreich and Tenacious Software LLC"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/3rdparty/tiny-aes/**"
SPDX-FileCopyrightText = "kokke (tiny-AES-c)"
SPDX-License-Identifier = "Unlicense"

[[annotations]]
path = ["src/3rdparty/qrcodegen/qrcodegen.cpp", "src/3rdparty/qrcodegen/qrcodegen.hpp"]
SPDX-FileCopyrightText = "Project Nayuki"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/3rdparty/qcustomplot/QTDMM_CHANGES.md"
SPDX-FileCopyrightText = "The QtDMM developers"
SPDX-License-Identifier = "GPL-3.0-or-later"
