protocol: UniTUT171
decoder: src/device/decoders/uni_t_ut171.cpp
devices: [Uni-Trend UT171A, Uni-Trend UT171B, Uni-Trend UT171C, Uni-Trend UT171B/C (UT-D07B Bluetooth)]
frames_per_reading: 1
unit_map:                      # spec spelling -> what the decoder emits
  "u": "µ"
sources:
  - "ablage/dmm-tools/docs/research/ut171/reverse-engineered-protocol.md (dmm-tools, GPL-3.0-or-later: from UNI-T's UT171C PC software and the manual, cross-checked with the captures of gulux's Uni-T-CP2110; no meter read there yet, issue #4)"

# UT-D09 cable (CP2110 or CH9329), 9600 8N1, or the UT-D07B adapter. The
# UT181A's framing (§3): AB CD, a 16-bit LE length (payload + 2), the
# payload, a 16-bit LE sum of the length bytes and the payload. The meter
# streams with SETUP > Communication ON after the connect command
# AB CD 04 00 0A 01 0F 00 (§4.3; pause: ... 0A 00 0E 00).
#
# Measurement (§5.1), 15 payload bytes: 02, flags (§5.3: bit 7 HOLD, bit 6
# manual range, bit 2 low battery), frame type (01; 03 the extended frame,
# 21 bytes, §5.2), mode (§6: 01 LoZ V, 02-04 V DC/AC/AC+DC, 05-07 mV,
# 08 continuity, 09 F, 0A Ohm, 0B diode, 0C/0D C/F, 0E nS, 0F Hz, 10 %,
# 11-13 uA, 14-16 mA, 17-19 A, 1A VFC, 1B % 4-20 mA, 1C/1D 600 A clamp,
# 24 NCV), range (1-based, 0 auto), main float32 LE, status2, a byte,
# aux float32 LE (the frequency in kHz on V AC and mV AC). The resistance
# float is in kOhm on ranges 2-4 and MOhm from 5 (gulux); the other modes
# in the base unit, UNVERIFIED for F, nS and Hz. A non-finite float: OL.
#
# The vectors are SYNTHETIC: frames built from the spec's layout, the values
# of dmm-tools' unit tests where named. No capture of a real meter exists;
# they test the decoder's reading of the spec.
vectors:
  - source_line: "V DC 12.345, auto range (dmm-tools parse_vdc)"
    bytes: AB CD 11 00 02 00 01 02 01 1F 85 45 41 00 00 00 00 00 00 41 01
    reading: {value: "12.345", unit: "V", range_mode: "auto"}
    expect: {special: "DC"}
  - source_line: "12.345 kOhm on range 3, manual range (parse_ohm, parse_manual_range)"
    bytes: AB CD 11 00 02 40 01 0A 03 1F 85 45 41 00 00 00 00 00 00 8B 01
    reading: {value: "12.345", unit: "kOhm", range_mode: "manual"}
    expect: {special: "OH"}
  - source_line: "1.2345 MOhm on range 5"
    bytes: AB CD 11 00 02 00 01 0A 05 19 04 9E 3F 00 00 00 00 00 00 1D 01
    reading: {value: "1.2345", unit: "MOhm", range_mode: "auto"}
    expect: {special: "OH"}
  - source_line: "V AC 230.1 with 0.05 kHz beside it (aux_value_populated_when_nonzero)"
    bytes: AB CD 11 00 02 00 01 03 02 9A 19 66 43 00 00 CD CC 4C 3D 97 03
    reading: {value: "230.1", unit: "V", range_mode: "auto"}
    expect: {special: "AC", val2: "0.05", unit2: "kHz", id2: 1}
  - source_line: "V AC 230.1, no frequency sent (aux_value_empty_when_zero)"
    bytes: AB CD 11 00 02 00 01 03 02 9A 19 66 43 00 00 00 00 00 00 75 01
    reading: {value: "230.1", unit: "V", range_mode: "auto"}
    expect: {special: "AC"}
  - source_line: "mV DC -12.5 with HOLD (parse_hold_flag)"
    bytes: AB CD 11 00 02 80 01 05 01 00 00 48 C1 00 00 00 00 00 00 A3 01
    reading: {value: "-12.5", unit: "mV", range_mode: "auto", flags: [HOLD]}
    expect: {special: "DC"}
  - source_line: "Ohm overload: NaN on range 6 (parse_nan_overload)"
    bytes: AB CD 11 00 02 00 01 0A 06 00 00 C0 7F 00 00 00 00 00 00 63 01
    reading: {value: "OL", unit: "MOhm", range_mode: "auto"}
    expect: {special: "OH", val: "OL"}
  - source_line: "NCV level 3 (parse_ncv)"
    bytes: AB CD 11 00 02 00 01 24 00 00 00 40 40 00 00 00 00 00 00 B8 00
    reading: {value: "3", unit: "", range_mode: "auto", shown: "none"}
    expect: {special: "NCV", val: "3"}
  - source_line: "uA DC 123.4 on range 1"
    bytes: AB CD 11 00 02 00 01 11 01 CD CC F6 42 00 00 00 00 00 00 F7 02
    reading: {value: "123.4", unit: "uA", range_mode: "auto"}
    expect: {special: "DC"}
  - source_line: "Temperature 23.5 C"
    bytes: AB CD 11 00 02 00 01 0C 01 00 00 BC 41 00 00 00 00 00 00 1E 01
    reading: {value: "23.5", unit: "C", range_mode: "auto"}
    expect: {special: "TE"}
  - source_line: "LoZ V 230"
    bytes: AB CD 11 00 02 00 01 01 01 00 00 66 43 00 00 00 00 00 00 BF 00
    reading: {value: "230", unit: "V", range_mode: "auto"}
    expect: {special: "AC"}
  - source_line: "50 Hz on range 1"
    bytes: AB CD 11 00 02 00 01 0F 01 00 00 48 42 00 00 00 00 00 00 AE 00
    reading: {value: "50", unit: "Hz", range_mode: "auto"}
    expect: {special: "HZ"}
  - source_line: "A DC 1.5 with low battery (parse_low_battery)"
    bytes: AB CD 11 00 02 04 01 17 01 00 00 C0 3F 00 00 00 00 00 00 2F 01
    reading: {value: "1.5", unit: "A", range_mode: "auto", flags: [LowBat]}
    expect: {special: "DC"}
  - source_line: "Capacitance 47 on range 2, in the base unit (scale UNVERIFIED)"
    bytes: AB CD 11 00 02 00 01 09 02 00 00 3C 42 00 00 00 00 00 00 9D 00
    reading: {value: "47", unit: "F", range_mode: "auto"}
  - source_line: "4.7 nF as a float in F: no exponent, a letter would read as overload"
    bytes: AB CD 11 00 02 00 01 09 02 A3 7D A1 31 00 00 00 00 00 00 11 02
    reading: {value: "0.0000000047", unit: "F", range_mode: "auto"}
    expect: {val: "0.0000000047"}
    expect: {special: "CA"}
  - source_line: "Conductance 12.5 nS"
    bytes: AB CD 11 00 02 00 01 0E 01 00 00 48 41 00 00 00 00 00 00 AC 00
    reading: {value: "12.5", unit: "nS", range_mode: "auto"}
  - source_line: "4-20 mA loop 50 %"
    bytes: AB CD 11 00 02 00 01 1B 01 00 00 48 42 00 00 00 00 00 00 BA 00
    reading: {value: "50", unit: "%", range_mode: "auto"}
