protocol: UniTUT8803
decoder: src/device/decoders/uni_t_ut8803.cpp
devices: [Uni-Trend UT8803, Uni-Trend UT8803E, Uni-Trend UT8803N]
frames_per_reading: 1
unit_map:                      # spec spelling -> what the decoder emits
  "u": "µ"
sources:
  - "ablage/dmm-tools/docs/research/ut8803/reverse-engineered-protocol.md (dmm-tools, GPL-3.0-or-later: from UNI-T's UCI SDK uci.dll, its programming manual and the user manual; no meter read there yet)"

# CP2110 inside the meter, 9600 8N1; the meter streams unasked (§2.4).
# Frame (§2.3), 21 bytes: AB CD, a byte, type 02, mode (§4.2: 00 ACV,
# 01 DCV, 02-04 AC uA/mA/A, 05-07 DC, 08 Ohm, 09 continuity, 0A diode,
# 0B L, 0C Q, 0D R, 0E C, 0F D, 10 R, 11 hFE, 12 SCR, 13 C, 14 F, 15 Hz,
# 16 duty), range ('0' + n: with the mode the prefix, after uci.dll),
# a byte, the display as 5 ASCII characters, two bytes, status 14 (bit 0
# HOLD, 2 OL, 3 minus), 15 (bit 0 REL, 1 manual range), 16 (bit 0 MIN,
# 1 MAX), 17 and 18 (test frequency, diode direction), then a 16-bit BE
# sum of bytes 0-18.
#
# The vectors are SYNTHETIC: frames built from the spec's layout, the
# displays of dmm-tools' unit tests where named. No capture of a real meter
# exists; they test the decoder's reading of the spec.
vectors:
  - source_line: "DC V 12.34 on range 1 (dmm-tools parse_dcv)"
    bytes: AB CD 00 02 01 31 00 31 32 2E 33 34 00 00 00 00 00 00 00 02 A4
    reading: {value: "12.34", unit: "V", range_mode: "auto"}
    expect: {special: "DC"}
  - source_line: "AC V 5.67 (parse_acv)"
    bytes: AB CD 00 02 00 31 00 20 35 2E 36 37 00 00 00 00 00 00 00 02 9B
    reading: {value: "5.67", unit: "V", range_mode: "auto"}
    expect: {special: "AC"}
  - source_line: "123.4 kOhm on range 1 (parse_ohm)"
    bytes: AB CD 00 02 08 31 00 31 32 33 2E 34 00 00 00 00 00 00 00 02 AB
    reading: {value: "123.4", unit: "kOhm", range_mode: "auto"}
    expect: {special: "OH"}
  - source_line: "Continuity OL (display_overload_string)"
    bytes: AB CD 00 02 09 30 00 20 20 20 4F 4C 00 00 04 00 00 00 00 02 B2
    reading: {value: "OL", unit: "Ohm", range_mode: "auto"}
    expect: {special: "BUZ", val: "OL"}
  - source_line: "DC V -23.45, the minus in status byte 14 (parse_negative_value)"
    bytes: AB CD 00 02 01 32 00 32 33 2E 34 35 00 00 08 00 00 00 00 02 B1
    reading: {value: "-23.45", unit: "V", range_mode: "auto"}
    expect: {special: "DC"}
  - source_line: "12.34 mA DC with HOLD (parse_hold_flag)"
    bytes: AB CD 00 02 06 30 00 31 32 2E 33 34 00 00 01 00 00 00 00 02 A9
    reading: {value: "12.34", unit: "mA", range_mode: "auto", flags: [HOLD]}
    expect: {special: "DC"}
  - source_line: "100.0 uA DC, REL and manual range (parse_rel_flag, parse_auto_range)"
    bytes: AB CD 00 02 05 30 00 31 30 30 2E 30 00 00 00 03 00 00 00 02 A1
    reading: {value: "100.0", unit: "uA", range_mode: "manual"}
    expect: {special: "DC"}
  - source_line: "12.34 mH, inductance on range 2"
    bytes: AB CD 00 02 0B 32 00 31 32 2E 33 34 00 00 00 00 00 00 00 02 AF
    reading: {value: "12.34", unit: "mH", range_mode: "auto"}
  - source_line: "47.00 nF on range 1"
    bytes: AB CD 00 02 0E 31 00 34 37 2E 30 30 00 00 00 00 00 00 00 02 B2
    reading: {value: "47.00", unit: "nF", range_mode: "auto"}
    expect: {special: "CA"}
  - source_line: "Dissipation factor 0.012"
    bytes: AB CD 00 02 0F 30 00 30 2E 30 31 32 00 00 00 00 00 00 00 02 AA
    reading: {value: "0.012", unit: "D", range_mode: "auto"}
  - source_line: "1.000 kHz on range 1"
    bytes: AB CD 00 02 15 31 00 31 2E 30 30 30 00 00 00 00 00 00 00 02 AF
    reading: {value: "1.000", unit: "kHz", range_mode: "auto"}
    expect: {special: "HZ"}
  - source_line: "1.234 A DC with MIN (parse_min_max_flags)"
    bytes: AB CD 00 02 07 30 00 31 2E 32 33 34 00 00 00 00 01 00 00 02 AA
    reading: {value: "1.234", unit: "A", range_mode: "auto"}
    expect: {special: "DC"}
  - source_line: "Temperature 23.5 C"
    bytes: AB CD 00 02 13 30 00 20 32 33 2E 35 00 00 00 00 00 00 00 02 A5
    reading: {value: "23.5", unit: "C", range_mode: "auto"}
    expect: {special: "TE"}
