protocol: UniTUT61Plus
decoder: src/device/decoders/unit_idmm.cpp
devices: [UNI-T UT61E+, UNI-T UT61D+, UNI-T UT61B+, UNI-T UT161E, UNI-T UT161D, UNI-T UT161B]
frames_per_reading: 1
unit_map:                      # spec spelling -> what the decoder emits
  "u": "µ"
sources:
  - "ablage/unit_ut61eplus/from_vendor/funOl_UT61E+/D+/B+.json and funOl_UT161E/D/B.json (range tables from UNI-T's own app)"
  - ablage/ut61xpy-main/adapters/ut61xp.py (ut61xpy - UT61X+ base class, range offsets, mode 25 channels)
  - ablage/ut61xpy-main/misc/current_ranges.md (current ranges of UT61D+ and UT61E+)
  - "ablage/dmm-tools/crates/dmm-lib/tests/golden/ut61eplus/ and ut161e/ (dmm-tools, GPL-3.0-or-later: payloads of a real UT61E+ and UT161E over the UT-D09 cable)"

# The UT61B+/D+/E+ and the UT161B/D/E speak the UNI-T iDMM frame of the UT60BT
# (see unit_idmm.yaml for the layout) - the UT61+ over the UT-D09 USB cable
# (HID UART, 9600 8N1) or the UT-D07B Bluetooth adapter, the UT161 over its
# built-in Bluetooth - polled with AB CD 03 5E 01 D9. Only the ranges differ
# from the UT60BT; UNI-T's own app tables (funOl_*.json, saved by the
# unit_ut61eplus project) and ut61xpy agree: the V positions start in volts
# (2.2 V resp. 6 V), mV stays mV, the uA and mA positions keep their unit, CAP
# is nF up to range 1, Hz is Hz up to range 1, and function 25 (AC/DC) is the
# DC V position that alternates DC and AC readings (flags C bit 3 = AC) - QtDMM
# makes the AC ones the second value.
#
# The first vectors are SYNTHETIC, built from that description (with correct
# checksums). The rest are real: UT61E+ and UT161E payloads captured for
# dmm-tools (its golden files; the UT161E from issue #7, @frixit), framed here
# with AB CD 10 and the sum; their readings are the ones dmm-tools gives.
# They showed that the function, not flags C bit 3, says AC or DC: real
# meters leave the bit clear in AC V and AC A, it marks only the AC frames
# of the alternating positions.
vectors:
  - source_line: "mode 0x16 r2: 12.345 kHz, as UNI-T's UT61E+ software V2.02 reads it (dmm-tools a0f661c; no meter sent it yet)"
    source: "dmm-tools a0f661c (synthetic)"
    bytes: AB CD 10 16 32 20 31 32 2E 33 34 35 00 00 00 00 00 03 1D
    reading: {value: "12.345", unit: "kHz", range_mode: auto}
    expect: {special: "HZ", val: "12.345"}
  - source_line: "mode 0x17: duty 50.0 %, as V2.02 reads it (dmm-tools a0f661c; no meter sent it yet)"
    source: "dmm-tools a0f661c (synthetic)"
    bytes: AB CD 10 17 30 20 20 20 35 30 2E 30 00 00 00 00 00 02 F2
    reading: {value: "50.0", unit: "%", range_mode: auto}
    expect: {special: "DU", val: "50.0"}
  - source_line: "mode 0x1F, which the table lacks (the app's dBV): its digits, no unit (dmm-tools 2738c05)"
    source: "dmm-tools 2738c05 (synthetic, the first frame with mode 0x1F)"
    bytes: AB CD 10 1F 30 20 31 2E 35 39 34 30 00 00 00 00 00 03 28
    reading: {value: "1.5940", unit: "", range_mode: auto}
    expect: {special: "", val: "1.5940", dval: 1.594}
  - source_line: "DCV r0: 1.5940 V (the 2.2 V range - volts, not mV as on the UT60BT)"
    bytes: AB CD 10 02 30 20 31 2E 35 39 34 30 00 00 00 00 00 03 0B
    reading: {value: "1.5940", unit: "V", range_mode: auto}
    expect: {special: "DC", val: "1.5940"}
  - source_line: "DCV r1: 12.345 V"
    bytes: AB CD 10 02 31 20 31 32 2E 33 34 35 00 00 00 00 00 03 08
    reading: {value: "12.345", unit: "V", range_mode: auto}
    expect: {special: "DC", val: "12.345"}
  - source_line: "ACV r2: 230.12 V"
    bytes: AB CD 10 00 32 20 32 33 30 2E 31 32 00 00 00 00 08 03 08
    reading: {value: "230.12", unit: "V", range_mode: auto}
    expect: {special: "AC", val: "230.12"}
  - source_line: "mV r0: 123.45 mV"
    bytes: AB CD 10 03 30 20 31 32 33 2E 34 35 00 00 00 00 00 03 08
    reading: {value: "123.45", unit: "mV", range_mode: auto}
    expect: {special: "DC", val: "123.45"}
  - source_line: "DCmA r1: 123.45 mA (the 220 mA range stays mA)"
