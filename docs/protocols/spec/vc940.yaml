protocol: VC940Continuous
decoder: src/device/decoders/vc940.cpp
devices: [Tenma 72-7732, Uni-Trend UT71B, Uni-Trend UT71CDE, Uni-Trend UT804, Voltcraft VC 920, Voltcraft VC 940, Voltcraft VC 960]
frames_per_reading: 2
unit_map:                      # log spelling -> what the decoder emits
  "µ": "u"
  "°C": "C"
  "°F": "dF"
sources:
  - docs/protocols/sources/UT71BCDE.log
  - docs/protocols/sources/UT804.log

# 'reading' is what the log says the meter displayed; dval, unit, range and
# hold are derived from it. Put decoder-specific assertions (special, val)
# under 'expect' by hand. 'range_label' and 'remark' are informational.
vectors:
  - source_line: "DC  1.234 V AUTO"
    bytes: 31 32 33 34 3A 31 31 30 31 0D 0A
    reading: {value: "1.234", unit: "V", coupling: DC, range_mode: auto}
    remark: "synthetic: a four digit range with a value, the logs only have 0.000"
  - source_line: "DC  0.0000 V AUTO BG"
    bytes: 30 30 30 30 30 31 31 30 31 0D 0A
    reading: {value: "0.0000", unit: "V", coupling: DC, range_mode: auto, flags: [BG]}
  - source_line: "DC -0.0000 V AUTO BG"
    bytes: 30 30 30 30 30 31 31 30 35 0D 0A
    reading: {value: "-0.0000", unit: "V", coupling: DC, range_mode: auto, flags: [BG]}
  - source_line: "DC -0.0001 V AUTO BG"
    bytes: 30 30 30 30 31 31 31 30 35 0D 0A
    reading: {value: "-0.0001", unit: "V", coupling: DC, range_mode: auto, flags: [BG]}
  - source_line: "DC -0.0007 V AUTO BG"
    bytes: 30 30 30 30 37 31 31 30 35 0D 0A
    reading: {value: "-0.0007", unit: "V", coupling: DC, range_mode: auto, flags: [BG]}
  - source_line: "DC  0.0005 V AUTO BG"
    bytes: 30 30 30 30 35 31 31 30 31 0D 0A
    reading: {value: "0.0005", unit: "V", coupling: DC, range_mode: auto, flags: [BG]}
  - source_line: "DC  0.0000 V MAN BG"
