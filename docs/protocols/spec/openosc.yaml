  - source_line: "0,1.3e-3,0,NAN,0,1,1,0,1,5358,1758088000"   # REL on
    bytes: 30 2C 31 2E 33 65 2D 33 2C 30 2C 4E 41 4E 2C 30 2C 31 2C 31 2C 30 2C 31 2C 35 33 35 38 2C 31 37 35 38 30 38 38 30 30 30 0A
