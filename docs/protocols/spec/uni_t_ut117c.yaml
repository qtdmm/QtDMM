protocol: UniTUT117C
decoder: src/device/decoders/uni_t_ut117c.cpp
devices: [Uni-Trend UT117C]
frames_per_reading: 1
sources:
  - "ablage/uni-t/uni-t-protocols/ut117c.md (notes decompiled from UNI-T's multimeter app: transport §1, frame §2, commands §4, reading §5, functions §7)"
  - "ablage/multimeter-main/docs/protocols/ut117c.md (libreble, ported from webspiderteam/Bluetooth-DMM-For-Windows, unverified)"

# UNI-T UT117C multimeter over Bluetooth LE, the ISSC service (write
# ...8841..., notify ...9616...). Frames: AB CD, a length (BE16), command,
# data, 16-bit BE sum of all bytes before. Polled: AB CD 00 04 05 00 01 81;
# the reading, command 0x02, 24 bytes:
#
#   4     0x02
#   5     function       1-19 (AC V, AC V low-pass, AC mV, DC V, DC mV, Ω,
#                        continuity, diode, capacitance, LoZ V, Hz on V, Hz
#                        low-pass, NCV, DC A, AC A, Hz on A, clamp AC A,
#                        clamp Hz, clamp DC A)
#   6     range          ASCII digit; NCV: '1' HI, else LO
#   7     Hz range
#   8-14  value          ASCII, space padded, point and sign included
#   15-17 unit           ASCII, "o" is Ω, "K" kilo, "u" micro
#   18    OL flag        '1' OL, '2' -OL
#   19    MAX/MIN        values unknown, not shown
#   20    flags A        bit 3 low battery, bit 1 HOLD, bit 0 REL
#   21    flags B        bit 1 AC (LoZ V), bit 3 auto range, bit 0 HV
#   22-23 sum
#
# The length is 0x14 as UNI-T's app reads it (frame = length + 4); libreble
# has 0x12 (frame = length + 6), accepted too, the sum decides. SYNTHETIC
# vectors: built from that layout, no capture of a meter exists.
vectors:
  - source_line: "DC V 5.123 V (synthetic)"
    bytes: AB CD 00 14 02 04 30 00 20 20 35 2E 31 32 33 56 20 20 30 00 00 00 03 C1
    reading: {value: "5.123", unit: "V"}
    expect: {special: "DC", val: "5.123"}
  - source_line: "AC V 230.4 V, HOLD (synthetic)"
    bytes: AB CD 00 14 02 01 31 00 20 20 32 33 30 2E 34 56 20 20 30 00 02 02 03 C1
    reading: {value: "230.4", unit: "V", flags: [HOLD]}
    expect: {special: "AC", val: "230.4"}
  - source_line: "4.702 kΩ (synthetic)"
    bytes: AB CD 00 14 02 06 31 00 20 20 34 2E 37 30 32 4B 6F 20 30 00 00 00 04 0A
    reading: {value: "4.702", unit: "kOhm"}
    expect: {special: "OH", val: "4.702"}
  - source_line: "Ω overload (synthetic)"
    bytes: AB CD 00 14 02 06 35 00 20 20 36 30 2E 30 30 4D 6F 20 31 00 00 00 04 0A
    reading: {value: "OL", unit: "MOhm"}
    expect: {special: "OH", val: "OL"}
  - source_line: "LoZ 231 V AC (synthetic)"
    bytes: AB CD 00 14 02 0A 32 00 20 20 20 20 32 33 31 56 20 20 30 00 00 02 03 A8
    reading: {value: "231", unit: "V"}
    expect: {special: "AC", val: "231"}
  - source_line: "1.234 kHz on V (synthetic)"
    bytes: AB CD 00 14 02 0B 30 00 20 20 31 2E 32 33 34 6B 48 7A 30 00 00 00 04 5E
    reading: {value: "1.234", unit: "kHz"}
    expect: {special: "HZ", val: "1.234"}
