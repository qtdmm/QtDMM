  - source_line: 'Hz on the main display, AC V on the small one, leads open - captured: 2026-10-27 from a Brymen BM827s (Minipa ET-2517A) over BU-86X (issue #35, @SidineiSantosSousa, 0.9.0 6749b6a report, step hz_acv).'
    bytes: 00 00 00 BF AF AF AF 40 BF E9 6F E4 10 10 00 00 82 82 82 82 10 00 00 00
    reading: {range_mode: auto, unit: Hz, value: '0'}
    expect: {id2: 1, unit2: V, val2: '0.364'}
  - source_line: 'nS with the leads open - captured: 2026-10-28 from a Brymen BM827s (Minipa ET-2517A) over BU-86X (issue #35, @SidineiSantosSousa, 0.9.0 6749b6a report, step ns).'
