  - source_line: 'Ω across a body, MΩ - captured: 2026-10-27 from a Brymen BM827s (Minipa ET-2517A) over BU-86X (issue #35, @SidineiSantosSousa, 0.9.0 6749b6a report, step ohm_body).'
