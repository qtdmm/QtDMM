  - source_line: 'Diode with the leads open: .0L, diod on the small display - captured: 2026-10-28 from a Brymen BM827s (Minipa ET-2517A) over BU-86X (issue #35, @SidineiSantosSousa, 0.9.0 6749b6a report, step diode).'
