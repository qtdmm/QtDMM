    bytes: 00 20 00 AF AF BF A0 00 00 00 00 00 00 00 90 0C 82 82 82 82 10 00 00 00
    reading: {coupling: DC, range_mode: auto, unit: uA, value: '0.1'}
  - source_line: 'DC V reading negative, the leads reversed on a DC source, AC V on the small display - captured: 2026-10-27 from a Brymen BM827s (Minipa ET-2517A) over BU-86X (issue #35, @SidineiSantosSousa, 0.9.0 6749b6a report, step dcv_negative).'
