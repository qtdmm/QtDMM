name: FreeBSD test build

on:
  push:
    branches: [ "master", "release/**" ]
  pull_request:
    branches: [ "master", "release/**" ]

# the token reads the repository only; release.yml publishes
permissions:
  contents: read

jobs:
  build:
    # GitHub has no FreeBSD runner; this boots a FreeBSD VM on the Ubuntu runner
    # and runs the steps inside it. Compile and test only, no packaging.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags and history: the version comes from git describe

    - name: Build and test in FreeBSD VM
      uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
      with:
        release: "14.2"
        usesh: true
        prepare: |
          pkg install -y cmake ninja ccache pkgconf git python3 \
            qt6-base qt6-serialport qt6-charts qt6-connectivity qt6-multimedia qt6-svg qt6-tools hidapi \
            dejavu fontconfig
        run: |
          # ccache: no cache is kept between runs, but the tests compile many
          # sources again, those come from the cache within the build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build
          ctest --test-dir build --output-on-failure --timeout 300 --parallel 4
