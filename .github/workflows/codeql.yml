name: "CodeQL Advanced"

# Actions and Python are analysed with every push and PR, they take seconds.
# C++ builds the whole program: once a week, on the release branches and by
# hand ("Run workflow"); SonarCloud looks at the C++ of every PR already
on:
  push:
    branches: [ "master", "release/**" ]
  pull_request:
    branches: [ "master", "release/**" ]
  schedule:
    - cron: '20 12 * * 6'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ actions, python ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"

  analyze-cpp:
    name: Analyze (c-cpp)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags and history: the version comes from git describe

    # the same Qt as the Ubuntu build, from its cache
    - name: Install Qt
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
      with:
        version: '6.8.3'
        modules: 'qtserialport qtcharts qtconnectivity qtmultimedia'
        cache: true

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends libhidapi-dev libgl-dev ninja-build libxkbcommon-x11-dev

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual

    # the program only: the tests are not analysed, and no ccache, CodeQL
    # has to see every compiler call
    - name: Build
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
        cmake --build build --parallel

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:c-cpp"
