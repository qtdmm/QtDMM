name: Windows build

on:
  push:
    branches: [ "master", "release/**" ]
  pull_request:
    branches: [ "master", "release/**" ]
  workflow_call:   # from release.yml for a version tag

# the token reads the repository only; release.yml publishes
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags and history: the version comes from git describe

    - name: Install Qt
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
      with:
        version: '6.8.*'
        arch: win64_msvc2022_64
        modules: 'qtserialport qtcharts qtconnectivity qtmultimedia'
        cache: true

    # Qt ships no fonts; the offscreen platform used by the widget tests
    # needs one, so put DejaVu where QFontDatabase looks (lib/fonts). The zip
    # is cached, and downloaded with retries when it is not: a failed
    # download from GitHub's release host should not fail the build
    - name: Cache the DejaVu fonts
      uses: actions/cache@v4
      with:
        path: dejavu.zip
        key: dejavu-fonts-ttf-2.37

    - name: Install fonts for the widget tests
      shell: pwsh
      run: |
        $fonts = Join-Path $env:QT_ROOT_DIR "lib/fonts"
        New-Item -ItemType Directory -Force $fonts | Out-Null
        if (-not (Test-Path dejavu.zip)) {
          Invoke-WebRequest -Uri https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip -OutFile dejavu.zip -MaximumRetryCount 4 -RetryIntervalSec 15
        }
        Expand-Archive dejavu.zip -DestinationPath dejavu
        Copy-Item dejavu/dejavu-fonts-ttf-2.37/ttf/DejaVuSans*.ttf $fonts
        Get-ChildItem $fonts

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      with:
        arch: x64

    # ccache: no cache is kept between runs, but the tests compile many
    # sources again, those come from the cache within the build. ccache
    # handles MSVC as long as there is no PDB (/Zi), which Release has not.
    # Only a speed-up: with Chocolatey down the build goes without it
    - name: Install ccache
      continue-on-error: true
      run: choco install ccache -y --no-progress

    - name: Configure
      shell: pwsh
      run: |
        $launcher = @()
        if (Get-Command ccache -ErrorAction SilentlyContinue) {
          $launcher = '-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
        }
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON @launcher

    - name: Build
      run: cmake --build build

    - name: Test
      run: ctest --test-dir build --output-on-failure --timeout 300 --parallel 4

    # ZIP (portable) and Inno Setup installer from the same install tree;
    # cpack runs install + windeployqt + iscc (preinstalled on the runner).
    - name: Package
      run: cpack --config build/CPackConfig.cmake

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: QtDMM-windows-x64
        path: |
          packages/*.zip
          packages/*.exe
